<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Importar/Exportar Avaliações em Massa</title>
    <link rel="stylesheet" href="../chamada/chamada.css">
    <link rel="stylesheet" href="avaliacoes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-main">
            <div class="header-titles">
                <div class="header-user">
                    <i data-lucide="file-check-2" class="header-avatar"></i>
                    <h1>Gerenciamento de Avaliações</h1>
                </div>
                <div class="header-meta">
                    <span><i data-lucide="edit-3"></i> Lançamento e Importação de Notas em Massa</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="btnOMR" class="btn btn-secondary">
                    <i data-lucide="grid-3x3"></i> Grade OMR
                </button>
                <button id="btnVoltar" class="btn btn-secondary">
                    <i data-lucide="arrow-left"></i> Voltar
                </button>
            </div>
        </div>
    </header>

    <main class="app-container">
            <div id="loading" class="loading-state">
                <div class="spinner"></div>
                <p id="loadingText">Aguarde...</p>
            </div>

            <!-- Tabs Navigation -->
            <div class="tabs-container hidden" id="tabsContainer" style="margin-top: 20px; align-items: flex-end;">
                <div id="tabsList" style="display: flex; flex-wrap: wrap; gap: 5px; flex-grow: 1;">
                    <!-- Abas injetadas dinamicamente aqui -->
                </div>
                <button id="btnNovaAba" class="tab-button-add" title="Nova Aba" style="margin-left: 10px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;">
                    <i data-lucide="plus"></i>
                </button>
            </div>

            <!-- Views Container -->
            <div id="tabViewsContainer">
                <!-- Visões ativas das abas renderizadas aqui -->
            </div>

            <!-- Template: Lançamento Direto -->
            <template id="tabTemplate">
                <div class="tab-view" style="margin-top: 20px;">
                    <div class="cards-view-container" style="background: var(--surface); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h3 style="margin: 0; font-size: 1.2rem; color: var(--text);">Selecione uma Turma e Disciplina</h3>
                            <div class="cards-loading hidden" style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem;">
                                <i data-lucide="loader" class="spinner-small"></i> Buscando instrumentos...
                            </div>
                        </div>
                        <div class="cards-grid-container" style="display: flex; flex-direction: column; gap: 20px;">
                            <!-- Sections injetadas via JS -->
                        </div>
                    </div>

                    <div class="grid-header hidden" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div style="display: flex; flex-direction: column;">
                            <h3 class="grid-title" style="margin: 0; font-size: 1.2rem; color: var(--text);"></h3>
                            <span class="grid-subtitle" style="font-size: 0.9rem; color: var(--text-muted);"></span>
                        </div>
                        <button class="btn btn-secondary btn-voltar-cards">
                            <i data-lucide="arrow-left"></i> Voltar para Turmas
                        </button>
                    </div>

                    <!-- Abas de Período -->
                    <div class="period-tabs-container hidden" style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;"></div>

                    <!-- Tabela DataGrid Native -->
                    <div class="hidden data-grid-container grid-container-wrapper">
                        <table class="data-grid tb-notas-direto">
                            <thead>
                                <tr class="tb-notas-head-row">
                                    <th class="col-aluno">Nome do Aluno</th>
                                </tr>
                            </thead>
                            <tbody class="tb-notas-body">
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Footer Actions -->
                    <div class="hidden footer-acoes">
                        <span class="txt-modificacoes" style="color: var(--text-muted); font-size: 0.9rem;">0 alterações pendentes</span>
                        <button class="btn btn-outline btn-preencher-zeros" title="Preencher todos os campos vazios com nota 0">
                            <i data-lucide="edit-3"></i> Preencher Vazios com 0
                        </button>
                        <button class="btn btn-success btn-salvar-direto shadow-md" disabled>
                            <i data-lucide="save"></i> Salvar Lançamentos Aba
                        </button>
                    </div>
                </div>
            </template>
            <div id="toastContainer" class="toast-container"></div>
        </main>

    <script src="../libs/lucide.min.js"></script>
    <script src="../../libs/xlsx.full.min.js"></script>
    <script src="../../api/escolaRS.js"></script>
    <script src="../../utils/dom.js"></script>
    <script src="../../services/avaliacoesService.js"></script>
    <script src="avaliacoes.js"></script>
</body>

</html>
